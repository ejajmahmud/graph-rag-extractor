[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rag-extractor"
version = "0.1.0"
description = "Knowledge graph triple extractor parsing text into (subject, predicate, object) relations with Cypher export"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
graph-rag-extractor = "graph_rag_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_rag_extractor*"]
